<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flock Hub Admin</title>
<style>
  body{margin:0;background:#f4efe3;color:#33281b;font-family:"Trebuchet MS",system-ui,sans-serif}
  main{max-width:900px;margin:0 auto;padding:16px}
  h1{margin:0 0 4px;font-size:22px} .sub{color:#6b5a44;margin-bottom:12px;font-size:14px}
  nav button,form button,button.b{font:inherit;margin:4px 6px 4px 0;padding:9px 14px;border-radius:10px;border:2px solid #8b5a2b;background:#f2c14e;color:#33281b;cursor:pointer}
  nav button.on{background:#8b5a2b;color:#fff}
  input,select,textarea{font:inherit;display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:8px;border:2px solid #c9a66b;background:#fff}
  .card{background:#fffaf0;border:2px solid #e2cfa5;border-radius:12px;padding:14px;margin-top:12px}
  .scroll{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{padding:8px;border-bottom:1px solid #e2cfa5;text-align:left;white-space:nowrap}
  .err{color:#a02020}
  .mrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .mrow select,.mrow input{width:auto;flex:1;min-width:110px}
</style>
</head>
<body><main id="app">Loading…</main>
<script type="module" src="/src/admin.js"></script>
</body>
</html>
