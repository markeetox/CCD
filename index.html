<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2f5d3a" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.svg" />
<title>Flock Hub</title>
<style>
  html,body{margin:0;height:100%;background:#2f5d3a;overflow:hidden;touch-action:none;font-family:"Trebuchet MS",system-ui,sans-serif}
  #game{position:fixed;inset:0}
  #hud{position:fixed;top:env(safe-area-inset-top,0);left:0;padding:10px 14px;color:#fff;font-weight:bold;text-shadow:0 1px 3px #000;pointer-events:none}
  #joy{position:fixed;left:calc(24px + env(safe-area-inset-left,0));bottom:calc(28px + env(safe-area-inset-bottom,0));width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.6);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(255,255,255,.85);pointer-events:none}
  #panel{display:none;position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,88vw);max-height:80vh;overflow:auto;background:#fffaf0;color:#33281b;padding:18px;border-radius:14px;border:3px solid #8b5a2b;line-height:1.45}
  #panel h2{margin:0 0 8px}
  #panel button{font:inherit;margin:6px 6px 0 0;padding:10px 14px;border-radius:10px;border:2px solid #8b5a2b;background:#f2c14e;color:#33281b;cursor:pointer}
  #panel input{font:inherit;display:block;width:100%;box-sizing:border-box;margin:4px 0;padding:10px;border-radius:8px;border:2px solid #8b5a2b;background:#fff}
  #panel hr{border:0;border-top:2px dashed #c9a66b;margin:14px 0}
  #panel .sw{width:40px;height:40px;padding:0;border-radius:50%}
  #toast{position:fixed;top:calc(52px + env(safe-area-inset-top,0));left:50%;transform:translateX(-50%);background:#fffaf0;color:#33281b;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:11}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<div id="joy"><div id="knob"></div></div>
<div id="panel"></div>
<div id="toast"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
